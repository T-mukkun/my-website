name: Remove underline

on:
  push:
    paths:
      - '.github/workflows/remove-underline.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove underline decoration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '              <span class="absolute bottom-1 left-0 w-full h-2 bg-slate-200/80 -z-10"></span>\n'
          if target not in s:
              raise SystemExit('Target underline span not found')
          p.write_text(s.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-underline.yml
          git commit -m "Remove underline decoration from heading"
          git push
